# Overlay for servers without a host-level Nginx (for example hospital servers
# where packages cannot be installed). Adds a "tls" container that publishes
# ports 80 and 443 on the host, terminates HTTPS and proxies to "web".
#
# Enable it by adding to .env.docker:
#   COMPOSE_FILE=compose.yaml:compose.tls.yaml
#   TECHCONNECT_TLS_DIR=/etc/techconnect/tls   # contains techconnect.crt + techconnect.key
#
# See docs/despliegue-produccion-hospital.md, section 6A.
services:
  tls:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TECHCONNECT_TLS_DIR:-/etc/techconnect/tls}:/etc/nginx/tls:ro
    healthcheck:
      # -Y off: busybox wget ignores NO_PROXY, and Docker may inject the
      # host's outbound proxy into the container (~/.docker/config.json).
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
