# HTTPS front for servers without a host-level Nginx (see compose.tls.yaml).
# Terminates TLS with the certificate mounted at /etc/nginx/tls and proxies
# everything to the "web" container, which serves the app and /api.

# Docker's embedded DNS: re-resolve "web" so recreating it never leaves a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/techconnect.crt;
    ssl_certificate_key /etc/nginx/tls/techconnect.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Excel/ZIP imports from Admin -> Data transfer
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        set $upstream http://web:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Large imports can take a while
        proxy_read_timeout 300s;
    }
}
