map $http_accept_language $lang {
    default en;
    ~*^es es;
    ~*^en en;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Emit relative Location headers so redirects keep the scheme, host and
    # port the browser used (host Nginx on 443, SSH tunnel on :8080...).
    absolute_redirect off;

    # Allow dataset/PDX workbook imports larger than the 1 MB default
    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        # Re-resolve "api" through Docker's DNS so recreating the api
        # container (new IP) does not leave Nginx pointing at the old one.
        # With a variable and no URI part, the original /api/... URI is passed as-is.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Redirect root to appropriate language path
    location = / {
        return 301 /$lang/;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html;
    }

    location /es/ {
        try_files $uri $uri/ /es/index.html;
    }

    # Catch-all
    location / {
        try_files $uri $uri/ /$lang/index.html;
    }
}
